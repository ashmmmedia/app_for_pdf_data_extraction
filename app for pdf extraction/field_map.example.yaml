fields:
  - name: receipt_for
    pattern: '(?i)receipt\s*for\s*([^\n]+)'
    required: false

  - name: campaign_name
    pattern: '(?i)campaigns\s*([^\n]+)'
    required: false

  - name: campaign_start_date
    pattern: '(?i)campaigns\s*[^\n]+\s*CA\$[0-9,]+\.[0-9]{2}\s*From\s*([0-9]{1,2}\s+[A-Za-z]{3}\s+[0-9]{4},\s*[0-9]{2}:[0-9]{2})'
    required: false

  - name: campaign_end_date
    pattern: '(?i)campaigns\s*[^\n]+\s*CA\$[0-9,]+\.[0-9]{2}\s*From\s*[0-9]{1,2}\s+[A-Za-z]{3}\s+[0-9]{4},\s*[0-9]{2}:[0-9]{2}\s*to\s*([0-9]{1,2}\s+[A-Za-z]{3}\s+[0-9]{4},\s*[0-9]{2}:[0-9]{2})'
    required: false

  - name: campaign_cost
    pattern: '(?i)campaigns\s*[^\n]+\s*(CA\$[0-9,]+\.[0-9]{2})'
    required: false

  - name: account_id
    pattern: '(?i)account\s*id:\s*([0-9]+)'
    required: false

  - name: invoice_payment_date
    pattern: '(?i)invoice/payment\s*date\s*([0-9]{1,2}\s+[A-Za-z]{3}\s+[0-9]{4},\s*[0-9]{2}:[0-9]{2})'
    required: false

  - name: payment_method
    pattern: '(?i)payment\s*method\s*([^\n]+)'
    required: false

  - name: reference_number
    pattern: '(?i)reference\s*number:\s*([A-Z0-9]+)'
    required: false

  - name: total_amount
    pattern: '(?i)subtotal:\s*([A-Z]{2}\$[0-9,]+\.[0-9]{2}\s*[A-Z]{3})'
    required: false

  - name: transaction_id
    pattern: '(?is)transaction\s*id\s*(?:subtotal:.*?\s*)?([0-9]{8,}-[0-9]{8,})'
    required: false

  - name: gst_hst
    pattern: '(?i)gst/hst:\s*([A-Z]{3}\s*[0-9,.]+)'
    required: false

  - name: invoice_no
    pattern: '(?i)invoice\s*no\.\s*([A-Z0-9\-]+)'
    required: false
